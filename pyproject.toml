[project]
name = "fpso"
version = "0.1.0"
description = "Agentic supply chain for offshore FPSO operations (Phase 0: entity-resolution experiment)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
bedrock = ["anthropic[bedrock]>=1.15"]
db = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
fpso-synth = "fpso.synthetic.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fpso"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
