[project]
name = "fpso"
version = "0.1.0"
description = "Agentic supply chain for offshore FPSO operations (Phase 0: entity-resolution experiment)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=2.3,<3"]

[project.optional-dependencies]
anthropic = ["anthropic>=1.15"]
bedrock = ["anthropic[bedrock]>=1.15"]
db = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
fpso-synth = "fpso.synthetic.cli:main"
fpso-mcp = "fpso.connectors.mcp_server:main"
fpso-eval = "fpso.eval.harness:main"
fpso-model-check = "fpso.models:main"
fpso-adjudicate = "fpso.eval.adjudication:main"
fpso-onboard = "fpso.onboarding:main"
fpso-round = "fpso.eval.rounds:main"
fpso-readiness = "fpso.readiness:main"
fpso-replay = "fpso.synthetic.replay:main"
fpso-procure = "fpso.procurement:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fpso"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
